<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>garden417</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f1ea;
      color: #161616;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.9), transparent 38%),
        #f4f1ea;
    }

    nav {
      width: min(100%, 640px);
      display: grid;
      gap: 12px;
    }

    a {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px 24px;
      align-items: center;
      padding: 22px 24px;
      border: 1px solid rgba(22, 22, 22, 0.16);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.68);
      color: inherit;
      text-decoration: none;
      box-shadow: 0 8px 30px rgba(22, 22, 22, 0.04);
      transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }

    a::after {
      content: "\2197";
      grid-column: 2;
      grid-row: 1 / span 2;
      font-size: 1.25rem;
    }

    a:hover,
    a:focus-visible {
      transform: translateY(-2px);
      border-color: rgba(22, 22, 22, 0.45);
      box-shadow: 0 14px 36px rgba(22, 22, 22, 0.09);
      outline: none;
    }

    strong {
      font-size: clamp(1.15rem, 3vw, 1.45rem);
      letter-spacing: -0.02em;
    }

    span {
      color: #69645b;
      font-size: 0.92rem;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        background: #171717;
        color: #f4f1ea;
      }

      body {
        background:
          radial-gradient(circle at top left, rgba(255, 255, 255, 0.08), transparent 38%),
          #171717;
      }

      a {
        border-color: rgba(244, 241, 234, 0.18);
        background: rgba(255, 255, 255, 0.04);
      }

      a:hover,
      a:focus-visible {
        border-color: rgba(244, 241, 234, 0.52);
      }

      span {
        color: #b7b1a7;
      }
    }
  </style>
</head>
<body>
  <nav aria-label="Projects">
    <a href="https://garden417.vercel.app/">
      <strong>Profile</strong>
      <span>garden417.vercel.app</span>
    </a>
    <a href="./omok/">
      <strong>Omok</strong>
      <span>./omok/</span>
    </a>
    <a href="./baduk/">
      <strong>Baduk</strong>
      <span>./baduk/</span>
    </a>
    <a href="./chinese-tone/">
      <strong>Chinese Tone</strong>
      <span>./chinese-tone/</span>
    </a>
  </nav>
</body>
</html>
